    <script src="./static/js/title.js"></script>
    <script src="./static/js/writeups.js"></script>
    <script>
        // Forza tutti i link e bottoni ad essere bianchi
        document.addEventListener('DOMContentLoaded', function() {
            const forceWhiteColors = () => {
                // Link con classe .link
                const links = document.querySelectorAll('.link, a.link');
                links.forEach(link => {
                    link.style.color = '#fff';
                    link.style.setProperty('color', '#fff', 'important');
                });
                
                // Bottoni
                const buttons = document.querySelectorAll('button, input[type="button"], input[type="submit"]');
                buttons.forEach(button => {
                    button.style.color = '#fff';
                    button.style.setProperty('color', '#fff', 'important');
                });
            };
            
            forceWhiteColors();
            
            // Forza il titolo nella navbar ad essere bianco
            const titleLink = document.querySelector('#navbar > b:first-child > a, .titleee > a, nav > b:first-child > a');
            if (titleLink) {
                titleLink.style.color = '#fff';
                titleLink.style.setProperty('color', '#fff', 'important');
                // Forza anche tutti i figli diretti (tranne quelli con style orangered)
                const children = titleLink.querySelectorAll('*');
                children.forEach(child => {
                    if (!child.getAttribute('style') || !child.getAttribute('style').includes('orangered')) {
                        child.style.color = '#fff';
                        child.style.setProperty('color', '#fff', 'important');
                    }
                });
            }
            
            // Esegui anche dopo un breve delay per catturare elementi caricati dinamicamente
            setTimeout(forceWhiteColors, 100);
        });
    </script>
</body>
</html>
